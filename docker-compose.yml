services:
  db:
    image: postgres:16
    container_name: resume_mentor_db
    environment:
      POSTGRES_DB: resume_mentor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_mentor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
